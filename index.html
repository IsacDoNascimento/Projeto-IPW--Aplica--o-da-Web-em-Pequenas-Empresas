<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Layout - Bootstrap</title>
    <!-- CSS do Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/Style.css">
</head>
<body>

    <!-- 1. CABEÇALHO (BANNER / LOGO / DARK MODE) -->
    <header class="container-fluid bg-header-main py-4">
        <div class="row align-items-center">
            <div class="col-md-2 d-flex justify-content-center">
                <img src="Imagens/Logo  Panificadora Piauí Clara.png" alt="" style="height: 10em; width: auto ;">
            </div>
            <div class="col-md-8 text-center">
                <h1 class="text-uppercase molle-regular-italic" style="font-family: cursive;">PANIFICADORA PIAUÍ</h1>
            </div>
            <div class="col-md-2 text-center">
                <button class="btn text-white text-uppercase" style="font-size: 0.9rem; line-height: 1.2;" onclick="toggleDarkMode()">
                    Alterar Modo<br>Escuro
                </button>
            </div>
        </div>
    </header>

    <!-- 2. BARRA DE NAVEGAÇÃO SECUNDÁRIA PRETA -->
    <nav class="container-fluid bg-nav py-3">
        <div class="row align-items-center text-center">
            <div class="col-md-2">
                <img src="Imagens/Logo  Panificadora Piauí Clara.png" style="width: 10em; height: auto;">
            </div>
            <div class="col-md-2">
                <a href="#" class="text-white text-decoration-none text-uppercase">Sobre Nós</a>
            </div>
            <div class="col-md-2">
                <a href="#" class="text-white text-decoration-none text-uppercase">Endereço</a>
            </div>
            <div class="col-md-2">
                <a href="#" class="text-white text-decoration-none text-uppercase">Formulário<br>Endereço</a>
            </div>
            <div class="col-md-4 px-5">
                 <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- 2. BARRA DE NAVEGAÇÃO SECUNDÁRIA PRETA -->
    <nav class="container-fluid bg-nav2 py-3">
        <div class="row align-items-center text-center">
            <div class="col-md-3">
                <img src="Imagens/Logo  Panificadora Piauí Clara.png" style="width: 8em; height: auto;">
            </div>
            <div class="col-md-3">
                <a href="#" class="text-white text-decoration-none text-uppercase">Pães</a>
            </div>
            <div class="col-md-3">
                <a href="#" class="text-white text-decoration-none text-uppercase">Bolos</a>
            </div>
            <div class="col-md-3">
                <a href="#" class="text-white text-decoration-none text-uppercase">Bebidas</a>
            </div>
        </div>
    </nav>

    <!-- 3. CONTEÚDO PRINCIPAL (CARDS E VÍDEO) -->
    <main class="container-fluid bg-content py-5">
        <div class="container">
            <!-- Linha dos Cards -->
            <div class="row">
                <div class="col-md-3 col-sm-6">
                    <div class="placeholder-box card-box">CARDS</div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="placeholder-box card-box">CARDS</div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="placeholder-box card-box">CARDS</div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="placeholder-box card-box">CARDS</div>
                </div>
            </div>
            
            <!-- Linha do Vídeo Institucional -->
            <div class="row mt-4">
                <div class="col-12 text-center text-dark">
                    <h3 class="text-uppercase mb-0 fs-2" style="font-weight: 400;">Vídeo Institucional</h3>
                </div>
            </div>
        </div>
    </main>

    <!-- 4. RODAPÉ -->
    <footer class="container-fluid bg-nav py-5">
        <div class="row">
            <div class="col-12 text-center">
                <h2 class="text-footer text-uppercase display-5">Footer e FAQ</h2>
            </div>
        </div>
    </footer>

    <!-- Script para funcionalidade do Dark Mode -->
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
    
    <!-- JS do Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
