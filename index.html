<script>  
    function redirecionar(event) {  
        event.preventDefault();
        
        const termo = document.getElementById('redirecionamento').value.toLowerCase().trim();
    
        if (termo === 'pão francês' || termo === 'pao frances' || termo === 'pão frances' || termo === 'pao francês') {  
            window.location.href = 'Produtos html/Pães/Pão frances.html';  
        } else if (termo === 'pão integral' || termo === 'pao integral' || termo === 'pão integrau' || termo === 'pao integrau') {  
            window.location.href = 'Produtos html/Pães/Pão integral.html';  
        } else if (termo === 'pão de queijo' || termo === 'pao de queijo' || termo === 'pão queijo' || termo === 'pao queijo') {  
            window.location.href = 'Produtos html/Pães/Pão de Queijo.html';  
        } else if (termo === 'baguete' || termo === 'bagete') {  
            window.location.href = 'Produtos html/Pães/Baguete.html';  
        } else if (termo === 'bolo de cenoura' || termo === 'bolo cenoura') {  
            window.location.href = 'Produtos html/Bolos/Bolo de Cenoura.html';  
        } else if (termo === 'bolo de chocolate' || termo === 'bolo chocolate') {  
            window.location.href = 'Produtos html/Bolos/Bolo de Chocolate.html';  
        } else if (termo === 'bolo de fubá' || termo === 'bolo fubá') {  
            window.location.href = 'Produtos html/Bolos/Bolo de Fubá.html';  
        } else if (termo === 'bolo Red Velvet' || termo === 'bolo red velvet' || termo === 'bolo vermei' || termo === 'bolo vermelho') {  
            window.location.href = 'Produtos html/Bolos/Bolo Red Valvet.html';  
        } else if (termo === 'café' || termo === 'cafe') {  
            window.location.href = 'Produtos html/Bebidas/Café.html';  
        } else if (termo === 'capuccino' || termo === 'capucino' || termo === 'cappuccino' || termo === 'cappucino' || termo === 'caputinho' || termo === 'caputino' || termo === 'capputinho' || termo === 'capputino') {  
            window.location.href = 'Produtos html/Bebidas/Capuccino.html';  
        } else if (termo === 'chá gelado' || termo === 'cha gelado' || termo === 'xa gelado' || termo === 'xá gelado' || termo === 'chá' || termo === 'cha' || termo === 'xa' || termo === 'xá' || termo === 'chá jelado' || termo === 'cha jelado' || termo === 'xa jelado' || termo === 'xá jelado') {  
            window.location.href = 'Produtos html/Bebidas/Chá Gelado.html';  
        } else if (termo === 'suco natural' || termo === 'suco naturau' || termo === 'suco') {  
            window.location.href = 'Produtos html/Bebidas/Suco Natural.html';  
        } else {  
            alert('Produto não encontrado. Por favor, retorne ao menu e veja nossas opções.');  
        }
    }  
</script>

<!-- Script para funcionalidade do Dark Mode -->  
<script>  
    function toggleDarkMode() {  
        const isDark = document.body.classList.toggle('dark-mode');  
        const logo = document.getElementById('logo');  

        if (isDark) {  
            if (logo) logo.src = 'Imagens/Logo  Panificadora Piauí Clara.png';  
        } else {  
            if (logo) logo.src = 'Imagens/Logo Panificadora Piauí.png';  
        }  
    }  
</script>
